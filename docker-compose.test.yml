version: '3.8'

services:
  db_test:
    image: postgres:16-alpine
    container_name: l10n_belarus_test_db
    environment:
      POSTGRES_DB: odoo_test
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_test_password
    ports:
      - "5435:5432"
    volumes:
      - test_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 5

  odoo_test:
    image: odoo:18.0
    container_name: l10n_belarus_test_odoo
    depends_on:
      db_test:
        condition: service_healthy
    ports:
      - "8072:8069"
    volumes:
      # Монтируем наш модуль
      - ./currency_rate_update_by_nbb:/mnt/extra-addons/currency_rate_update_by_nbb:ro
      # Монтируем зависимость currency_rate_update
      - ../currency/currency_rate_update:/mnt/extra-addons/currency_rate_update:ro
    environment:
      - HOST=db_test
      - USER=odoo
      - PASSWORD=odoo_test_password
      - DB_NAME=odoo_test
    command: >
      bash -c "
      odoo -d odoo_test
      -i currency_rate_update,currency_rate_update_by_nbb
      --test-enable
      --stop-after-init
      --log-level=test
      --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
      "

volumes:
  test_db_data:
    name: l10n_belarus_test_db_data
